name: Auto-Clean

on:
  #自动清理：每月1日北京时间 02:00
  #cron 为 UTC，上月最后一天 18:00 = 北京时间当月1日 02:00，故用 28-31 触发再由北京日期门控
  schedule:
    - cron: 0 18 28-31 * *
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check Beijing date
        id: gate
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=Asia/Shanghai date +%d)
          echo "Beijing date: $today"
          if [ "$today" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete old Releases and Workflows
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
